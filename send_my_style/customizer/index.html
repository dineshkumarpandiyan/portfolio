<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>Customize — Premium Custom Shirt | SendMyStyle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Poppins", "Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] },
            boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
            colors: {
              primary: "#C45C72",
              "primary-hover": "#A9475C",
              "primary-active": "#89394B",
              background: "#FCF3F5",
              surface: "#FFFFFF",
              border: "#F1CBD3",
              heading: "#481F29",
              body: "#6B2D3B",
              accent: "#89394B",
              sendmystyle: {
                50: "#FCF3F5",
                100: "#F8E5E9",
                200: "#F1CBD3",
                300: "#E5A9B5",
                400: "#D78494",
                500: "#C45C72",
                600: "#A9475C",
                700: "#89394B",
                800: "#6B2D3B",
                900: "#481F29",
                950: "#2D141A",
              },
            },
          },
        },
      };
    </script>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <style>
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
      #preview-canvas {
        touch-action: none;
      }
    </style>
  </head>

  <body class="bg-background text-body min-h-screen antialiased">
    <!-- Simple header -->
    <header class="border-border bg-surface sticky top-0 z-40 border-b">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-3.5 sm:px-6">
        <a href="../pages/index.html" class="text-heading flex items-center space-x-0.5 text-xl font-bold">
          <span>Send</span><span class="text-primary">My</span><span>Style</span>
        </a>
        <a
          href="../pages/product-details.html"
          class="text-heading hover:text-primary inline-flex items-center gap-1.5 text-sm font-medium"
        >
          <i class="bx bx-arrow-back"></i> Back to product
        </a>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-5 py-6 sm:px-6 md:py-8">
      <nav class="text-body text-xs" aria-label="Breadcrumb">
        <a href="../pages/index.html" class="hover:text-primary">Home</a>
        <span class="text-sendmystyle-400 px-1.5">/</span>
        <a href="../pages/product-details.html" class="hover:text-primary">Product</a>
        <span class="text-sendmystyle-400 px-1.5">/</span>
        <span class="text-heading font-semibold">Customize</span>
      </nav>

      <div class="mt-4 grid grid-cols-1 gap-8 lg:grid-cols-[57%_1fr] lg:gap-10">
        <!-- Preview (55–60% on desktop) -->
        <section class="lg:sticky lg:top-24 lg:h-fit" aria-label="Product preview">
          <div class="border-border bg-surface shadow-soft relative overflow-hidden rounded-3xl border">
            <canvas
              id="preview-canvas"
              width="720"
              height="820"
              class="h-auto w-full"
              role="img"
              aria-label="Live preview of your customized product"
            ></canvas>
            <span
              class="bg-surface/90 text-primary shadow-soft pointer-events-none absolute left-4 top-4 inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-semibold backdrop-blur"
            >
              <i class="bx bx-pencil"></i> Live preview
            </span>
          </div>
          <p class="text-body mt-3 text-center text-xs">
            Preview is indicative. Placeholder art shown until seller product images are connected.
          </p>
        </section>

        <!-- Controls (40–45%) -->
        <section aria-label="Customization options" class="pb-24 lg:pb-0">
          <!-- Product switcher (demo: swap between catalog products) -->
          <div class="mb-4">
            <label for="product-picker" class="text-body mb-1 block text-[11px] font-semibold uppercase tracking-widest"
              >Try a product</label
            >
            <div class="relative">
              <select
                id="product-picker"
                class="border-border bg-surface text-heading focus:border-primary w-full appearance-none rounded-lg border py-2.5 pl-4 pr-9 text-sm font-medium outline-none"
              ></select>
              <i
                class="bx bx-chevron-down text-body pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-lg"
              ></i>
            </div>
          </div>

          <p class="text-body text-xs font-semibold uppercase tracking-widest" id="p-category">Category</p>
          <h1 class="font-display text-heading mt-1 text-2xl font-bold sm:text-3xl" id="p-name">Product</h1>
          <p class="text-body mt-2 text-sm" id="p-desc"></p>
          <p class="text-body mt-2 text-sm">
            Base price <span class="text-heading font-semibold" id="p-base-price">₹0</span>
          </p>

          <!-- Variants -->
          <div class="border-border bg-surface mt-6 rounded-2xl border p-5">
            <h2 class="text-heading text-sm font-bold uppercase tracking-wide">Select Variants</h2>
            <div id="variants" class="mt-3"></div>
          </div>

          <!-- Customization -->
          <div class="border-border bg-surface mt-5 rounded-2xl border p-5">
            <div class="mb-4 flex items-center gap-2">
              <i class="bx bx-customize text-primary text-lg"></i>
              <h2 class="text-heading text-sm font-bold uppercase tracking-wide">Customize the details</h2>
            </div>
            <div id="customization"></div>
          </div>

          <!-- Summary -->
          <div class="border-border bg-surface mt-5 rounded-2xl border p-5">
            <h2 class="text-heading text-sm font-bold uppercase tracking-wide">Your Style</h2>
            <div id="summary" class="divide-border/60 mt-3 divide-y"></div>
            <div class="border-border mt-3 flex items-center justify-between border-t pt-3">
              <span class="text-heading text-sm font-semibold">Total</span>
              <span class="font-display text-heading text-xl font-bold" id="total-price">₹0</span>
            </div>
            <div class="mt-4 flex gap-3">
              <button
                type="button"
                data-reset
                class="border-border text-heading hover:border-primary hover:text-primary inline-flex items-center justify-center gap-2 rounded-full border px-5 py-3 text-sm font-semibold transition"
              >
                <i class="bx bx-reset"></i> Reset
              </button>
              <button
                type="button"
                data-add-cart
                class="bg-primary shadow-soft hover:bg-primary-hover active:bg-primary-active inline-flex flex-1 items-center justify-center gap-2 rounded-full px-6 py-3 text-sm font-semibold text-white transition"
              >
                <i class="bx bx-cart-add"></i> Add Customized to Bag
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Sticky Add to Cart (mobile) -->
    <div class="border-border bg-surface/95 fixed inset-x-0 bottom-0 z-40 border-t p-3 backdrop-blur lg:hidden">
      <div class="mx-auto flex max-w-7xl items-center gap-3 px-2">
        <div class="leading-tight">
          <p class="text-body text-[11px]">Total</p>
          <p class="font-display text-heading text-lg font-bold" id="total-price-sticky">₹0</p>
        </div>
        <button
          type="button"
          data-reset
          aria-label="Reset customization"
          class="border-border text-heading flex h-11 w-11 items-center justify-center rounded-full border"
        >
          <i class="bx bx-reset text-lg"></i>
        </button>
        <button
          type="button"
          data-add-cart
          class="bg-primary shadow-soft hover:bg-primary-hover inline-flex flex-1 items-center justify-center gap-2 rounded-full px-5 py-3 text-sm font-semibold text-white transition"
        >
          <i class="bx bx-cart-add"></i> Add to Bag
        </button>
      </div>
    </div>

    <!-- Toast -->
    <div
      id="toast"
      role="status"
      aria-live="polite"
      class="bg-sendmystyle-950 shadow-soft pointer-events-none fixed bottom-24 left-1/2 z-50 -translate-x-1/2 translate-y-20 rounded-full px-5 py-3 text-sm font-medium text-white opacity-0 transition-all duration-300 lg:bottom-8"
    ></div>

    <!-- Modules (order matters: data → engines → app) -->
    <script src="js/product-data.js"></script>
    <script src="js/price-engine.js"></script>
    <script src="js/preview-engine.js"></script>
    <script src="js/upload-handler.js"></script>
    <script src="js/customization-engine.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
