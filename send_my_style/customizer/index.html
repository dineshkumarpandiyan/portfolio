<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>Customize — Premium Custom Shirt | SendMyStyle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Poppins", "Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] },
                    boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
                    colors: {
                        primary: "#C45C72", "primary-hover": "#A9475C", "primary-active": "#89394B",
                        background: "#FCF3F5", surface: "#FFFFFF", border: "#F1CBD3",
                        heading: "#481F29", body: "#6B2D3B", accent: "#89394B",
                        sendmystyle: { 50: "#FCF3F5", 100: "#F8E5E9", 200: "#F1CBD3", 300: "#E5A9B5", 400: "#D78494", 500: "#C45C72", 600: "#A9475C", 700: "#89394B", 800: "#6B2D3B", 900: "#481F29", 950: "#2D141A" },
                    },
                },
            },
        };
    </script>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <style>
        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }
        #preview-canvas { touch-action: none; }
    </style>
</head>

<body class="min-h-screen bg-background text-body antialiased">
    <!-- Simple header -->
    <header class="sticky top-0 z-40 border-b border-border bg-surface">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-3.5 sm:px-6">
            <a href="../pages/index.html" class="flex items-center space-x-0.5 text-xl font-bold text-heading">
                <span>Send</span><span class="text-primary">My</span><span>Style</span>
            </a>
            <a href="../pages/product-details.html"
                class="inline-flex items-center gap-1.5 text-sm font-medium text-heading hover:text-primary">
                <i class="bx bx-arrow-back"></i> Back to product
            </a>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-5 py-6 sm:px-6 md:py-8">
        <nav class="text-xs text-body" aria-label="Breadcrumb">
            <a href="../pages/index.html" class="hover:text-primary">Home</a>
            <span class="px-1.5 text-sendmystyle-400">/</span>
            <a href="../pages/product-details.html" class="hover:text-primary">Product</a>
            <span class="px-1.5 text-sendmystyle-400">/</span>
            <span class="font-semibold text-heading">Customize</span>
        </nav>

        <div class="mt-4 grid grid-cols-1 gap-8 lg:grid-cols-[57%_1fr] lg:gap-10">
            <!-- Preview (55–60% on desktop) -->
            <section class="lg:sticky lg:top-24 lg:h-fit" aria-label="Product preview">
                <div class="relative overflow-hidden rounded-3xl border border-border bg-surface shadow-soft">
                    <canvas id="preview-canvas" width="720" height="820" class="h-auto w-full"
                        role="img" aria-label="Live preview of your customized product"></canvas>
                    <span class="pointer-events-none absolute left-4 top-4 inline-flex items-center gap-1.5 rounded-full bg-surface/90 px-3 py-1.5 text-xs font-semibold text-primary shadow-soft backdrop-blur">
                        <i class="bx bx-pencil"></i> Live preview
                    </span>
                </div>
                <p class="mt-3 text-center text-xs text-body">
                    Preview is indicative. Placeholder art shown until seller product images are connected.
                </p>
            </section>

            <!-- Controls (40–45%) -->
            <section aria-label="Customization options" class="pb-24 lg:pb-0">
                <!-- Product switcher (demo: swap between catalog products) -->
                <div class="mb-4">
                    <label for="product-picker" class="mb-1 block text-[11px] font-semibold uppercase tracking-widest text-body">Try a product</label>
                    <div class="relative">
                        <select id="product-picker"
                            class="w-full appearance-none rounded-lg border border-border bg-surface py-2.5 pl-4 pr-9 text-sm font-medium text-heading outline-none focus:border-primary"></select>
                        <i class="bx bx-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-lg text-body"></i>
                    </div>
                </div>

                <p class="text-xs font-semibold uppercase tracking-widest text-body" id="p-category">Category</p>
                <h1 class="font-display mt-1 text-2xl font-bold text-heading sm:text-3xl" id="p-name">Product</h1>
                <p class="mt-2 text-sm text-body" id="p-desc"></p>
                <p class="mt-2 text-sm text-body">Base price <span class="font-semibold text-heading" id="p-base-price">₹0</span></p>

                <!-- Variants -->
                <div class="mt-6 rounded-2xl border border-border bg-surface p-5">
                    <h2 class="text-sm font-bold uppercase tracking-wide text-heading">Select Variants</h2>
                    <div id="variants" class="mt-3"></div>
                </div>

                <!-- Customization -->
                <div class="mt-5 rounded-2xl border border-border bg-surface p-5">
                    <div class="mb-4 flex items-center gap-2">
                        <i class="bx bx-customize text-lg text-primary"></i>
                        <h2 class="text-sm font-bold uppercase tracking-wide text-heading">Customize the details</h2>
                    </div>
                    <div id="customization"></div>
                </div>

                <!-- Summary -->
                <div class="mt-5 rounded-2xl border border-border bg-surface p-5">
                    <h2 class="text-sm font-bold uppercase tracking-wide text-heading">Your Style</h2>
                    <div id="summary" class="mt-3 divide-y divide-border/60"></div>
                    <div class="mt-3 flex items-center justify-between border-t border-border pt-3">
                        <span class="text-sm font-semibold text-heading">Total</span>
                        <span class="font-display text-xl font-bold text-heading" id="total-price">₹0</span>
                    </div>
                    <div class="mt-4 flex gap-3">
                        <button type="button" data-reset
                            class="inline-flex items-center justify-center gap-2 rounded-full border border-border px-5 py-3 text-sm font-semibold text-heading transition hover:border-primary hover:text-primary">
                            <i class="bx bx-reset"></i> Reset
                        </button>
                        <button type="button" data-add-cart
                            class="inline-flex flex-1 items-center justify-center gap-2 rounded-full bg-primary px-6 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-primary-hover active:bg-primary-active">
                            <i class="bx bx-cart-add"></i> Add Customized to Bag
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Sticky Add to Cart (mobile) -->
    <div class="fixed inset-x-0 bottom-0 z-40 border-t border-border bg-surface/95 p-3 backdrop-blur lg:hidden">
        <div class="mx-auto flex max-w-7xl items-center gap-3 px-2">
            <div class="leading-tight">
                <p class="text-[11px] text-body">Total</p>
                <p class="font-display text-lg font-bold text-heading" id="total-price-sticky">₹0</p>
            </div>
            <button type="button" data-reset aria-label="Reset customization"
                class="flex h-11 w-11 items-center justify-center rounded-full border border-border text-heading">
                <i class="bx bx-reset text-lg"></i>
            </button>
            <button type="button" data-add-cart
                class="inline-flex flex-1 items-center justify-center gap-2 rounded-full bg-primary px-5 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-primary-hover">
                <i class="bx bx-cart-add"></i> Add to Bag
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite"
        class="pointer-events-none fixed bottom-24 left-1/2 z-50 -translate-x-1/2 translate-y-20 rounded-full bg-sendmystyle-950 px-5 py-3 text-sm font-medium text-white opacity-0 shadow-soft transition-all duration-300 lg:bottom-8"></div>

    <!-- Modules (order matters: data → engines → app) -->
    <script src="js/product-data.js"></script>
    <script src="js/price-engine.js"></script>
    <script src="js/preview-engine.js"></script>
    <script src="js/upload-handler.js"></script>
    <script src="js/customization-engine.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
