        location.hash = path;

        return location.hash.replace(/^#/, "") || "/";

        return cart.reduce((a, x) => a + x.qty, 0);

      function product(id) {
        return products.find((p) => p.id === +id);
      }
      function addCart(id, customData = null) {
        const p = product(id),
          key = customData ? `${id}-${JSON.stringify(customData)}` : String(id);
        let x = cart.find((i) => i.key === key);
        if (x) x.qty++;
        else cart.push({ key, id: +id, qty: 1, size: state.size, custom: customData });
        save();
        toast("Added to bag");
        render();
      }
      function toggleWish(id) {
        id = +id;
        wish = wish.includes(id) ? wish.filter((x) => x !== id) : [...wish, id];

        toast(wish.includes(id) ? "Added to wishlist" : "Removed from wishlist");
        render();

      }
      function Search() {
        return `<div class="mx-auto max-w-3xl px-4 py-8 sm:px-6"><div class="relative"><input autofocus oninput="state.query=this.value;renderSearch()" value="${state.query}" class="h-12 w-full rounded-xl border px-4 text-sm outline-none" placeholder="Search styles, brands and more"></div><div id="searchResults" class="mt-8"></div></div>`;
      }
      function renderSearch() {
        const e = document.getElementById("searchResults");
        if (!e) return;
        let q = state.query.toLowerCase(),
          list = products.filter((p) => (p.name + " " + p.brand + " " + p.cat).toLowerCase().includes(q));
        e.innerHTML = `<p class="text-xs text-slate-500">${q ? list.length + " results" : "Start typing to search"}</p><div class="mt-5 grid grid-cols-2 gap-5">${list.map(ProductCard).join("")}</div>`;
      }
      function render() {
        let p = path().split("?")[0],
          content =
            p === "/"
              ? Home()
              : p === "/shop"
                ? Shop()
                : p === "/cart"
                  ? Cart()
                  : p === "/checkout"
                    ? Checkout()
                    : p === "/success"
                      ? Success()
                      : p === "/wishlist"
                        ? Wishlist()
                        : p === "/profile"
                          ? Profile()
                          : p === "/orders"
                            ? Orders()
                            : p === "/login"
                              ? Login()
                              : p === "/search"
                                ? Search()
                                : p.startsWith("/product/")
                                  ? ProductPage(p.split("/")[2])
                                  : p.startsWith("/customize/")
                                    ? Customize(p.split("/")[2])
                                    : Home();
        document.getElementById("app").innerHTML = Header() + `<main>${content}</main>` + Footer();
        if (p === "/search") renderSearch();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      window.addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
