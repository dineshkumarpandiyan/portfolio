<div class="bg-background px-4 pt-4 sm:px-6 sm:pt-6">
  <div class="border-border bg-surface shadow-soft mx-auto max-w-7xl overflow-hidden rounded-3xl border">
    <section
      id="hero"
      class="relative overflow-hidden"
      aria-roledescription="carousel"
      aria-label="SendMyStyle highlights"
    >
      <!-- Slides are rendered here by initHeroCarousel() -->
      <div data-hero-track class="grid"></div>

      <!-- Pagination Dots + Controls -->
      <div class="relative z-20 -mt-1 flex items-center justify-center gap-4 pb-6 md:pb-8">
        <button
          type="button"
          data-hero-prev
          aria-label="Previous slide"
          class="border-border text-heading hover:border-primary hover:text-primary flex h-9 w-9 items-center justify-center rounded-full border transition"
        >
          <i class="bx bx-chevron-left text-xl"></i>
        </button>

        <div data-hero-dots role="tablist" aria-label="Choose slide" class="flex items-center gap-2"></div>

        <button
          type="button"
          data-hero-next
          aria-label="Next slide"
          class="border-border text-heading hover:border-primary hover:text-primary flex h-9 w-9 items-center justify-center rounded-full border transition"
        >
          <i class="bx bx-chevron-right text-xl"></i>
        </button>
      </div>
    </section>
  </div>
</div>
