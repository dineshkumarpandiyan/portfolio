<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>Explore Styles — SendMyStyle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Poppins", "Inter", "ui-sans-serif", "system-ui", "sans-serif"],
                        display: ["Space Grotesk", "sans-serif"],
                    },
                    boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
                    colors: {
                        primary: "#C45C72",
                        "primary-hover": "#A9475C",
                        "primary-active": "#89394B",
                        background: "#FCF3F5",
                        surface: "#FFFFFF",
                        border: "#F1CBD3",
                        heading: "#481F29",
                        body: "#6B2D3B",
                        accent: "#89394B",
                        sendmystyle: {
                            50: "#FCF3F5", 100: "#F8E5E9", 200: "#F1CBD3", 300: "#E5A9B5",
                            400: "#D78494", 500: "#C45C72", 600: "#A9475C", 700: "#89394B",
                            800: "#6B2D3B", 900: "#481F29", 950: "#2D141A",
                        },
                    },
                },
            },
        };
    </script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/script.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body class="flex min-h-screen flex-col bg-background text-body antialiased">
    <div id="site-web-header"></div>
    <div id="site-mobile-header"></div>

    <main class="flex-1">
        <div class="mx-auto max-w-7xl px-5 py-6 sm:px-6 md:py-8">
            <!-- Breadcrumb -->
            <nav class="text-xs text-body" aria-label="Breadcrumb">
                <a href="index.html" class="hover:text-primary">Home</a>
                <span class="px-1.5 text-sendmystyle-400">/</span>
                <span class="font-semibold text-heading" data-listing-title>Explore Styles</span>
            </nav>

            <div class="mt-4 flex items-end justify-between gap-3">
                <div>
                    <h1 class="font-display text-2xl font-bold text-heading sm:text-3xl" data-listing-heading>Explore Styles</h1>
                    <p class="mt-1 text-sm text-body"><span data-count>0</span> products</p>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Mobile filter button -->
                    <button type="button" data-open-filters
                        class="inline-flex items-center gap-1.5 rounded-lg border border-border bg-surface px-3 py-2.5 text-sm font-medium text-heading lg:hidden">
                        <i class="bx bx-slider-alt"></i> Filters
                    </button>
                    <!-- Sort -->
                    <label class="relative">
                        <span class="sr-only">Sort by</span>
                        <select data-sort
                            class="appearance-none rounded-lg border border-border bg-surface py-2.5 pl-4 pr-9 text-sm font-medium text-heading outline-none focus:border-primary">
                            <option value="popular">Sort: Popular</option>
                            <option value="low">Price: Low to High</option>
                            <option value="high">Price: High to Low</option>
                            <option value="discount">Discount</option>
                            <option value="rating">Rating</option>
                        </select>
                        <i class="bx bx-chevron-down pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-lg text-body"></i>
                    </label>
                </div>
            </div>

            <!-- Active filter chips -->
            <div data-active-filters class="mt-4 flex flex-wrap items-center gap-2 empty:hidden"></div>

            <div class="mt-4 grid grid-cols-1 gap-6 lg:grid-cols-[240px_1fr]">
                <!-- Filters (desktop) -->
                <aside class="hidden lg:block">
                    <div data-filters class="rounded-2xl border border-border bg-surface p-5"></div>
                </aside>

                <!-- Product grid -->
                <div>
                    <div data-listing-grid class="grid grid-cols-2 gap-4 sm:grid-cols-3 xl:grid-cols-4"></div>
                    <div data-listing-empty class="hidden rounded-2xl border border-border bg-surface p-10 text-center">
                        <i class="bx bx-search-alt text-4xl text-sendmystyle-300"></i>
                        <p class="mt-3 text-sm font-semibold text-heading">No products match your filters</p>
                        <button type="button" data-clear-all class="mt-4 text-sm font-semibold text-primary hover:text-primary-hover">Clear all filters</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile filter drawer -->
    <div data-filter-drawer class="fixed inset-0 z-50 hidden lg:hidden">
        <div class="absolute inset-0 bg-sendmystyle-950/50 opacity-0 transition-opacity duration-300" data-filter-overlay></div>
        <aside class="drawer absolute right-0 top-0 flex h-full w-[85%] max-w-sm translate-x-full flex-col bg-surface shadow-soft" data-filter-panel>
            <div class="flex items-center justify-between border-b border-border px-5 py-4">
                <h2 class="text-sm font-bold uppercase tracking-wide text-heading">Filters</h2>
                <button type="button" aria-label="Close" class="text-2xl text-heading" data-close-filters><i class="bx bx-x"></i></button>
            </div>
            <div data-filters-mobile class="flex-1 overflow-y-auto p-5"></div>
            <div class="grid grid-cols-2 gap-3 border-t border-border p-4">
                <button type="button" data-clear-all class="rounded-full border border-border py-2.5 text-sm font-semibold text-heading hover:border-primary hover:text-primary">Clear All</button>
                <button type="button" data-close-filters class="rounded-full bg-primary py-2.5 text-sm font-semibold text-white hover:bg-primary-hover">Show Results</button>
            </div>
        </aside>
    </div>

    <footer id="site-footer"></footer>
</body>

</html>
