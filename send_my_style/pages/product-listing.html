<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>Explore Styles — SendMyStyle</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../assets/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/favicon/favicon-96x96.png" />
    <meta name="apple-mobile-web-app-title" content="SendMyStyle" />
    <link rel="manifest" href="../assets/images/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Poppins", "Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "sans-serif"],
            },
            boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
            colors: {
              primary: "#C45C72",
              "primary-hover": "#A9475C",
              "primary-active": "#89394B",
              background: "#FCF3F5",
              surface: "#FFFFFF",
              border: "#F1CBD3",
              heading: "#481F29",
              body: "#6B2D3B",
              accent: "#89394B",
              sendmystyle: {
                50: "#FCF3F5",
                100: "#F8E5E9",
                200: "#F1CBD3",
                300: "#E5A9B5",
                400: "#D78494",
                500: "#C45C72",
                600: "#A9475C",
                700: "#89394B",
                800: "#6B2D3B",
                900: "#481F29",
                950: "#2D141A",
              },
            },
          },
        },
      };
    </script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/script.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body class="bg-background text-body flex min-h-screen flex-col antialiased">
    <div id="site-web-header"></div>
    <div id="site-mobile-header"></div>

    <main class="flex-1">
      <div class="mx-auto max-w-7xl px-5 py-6 sm:px-6 md:py-8">
        <!-- Breadcrumb -->
        <nav class="text-body text-xs" aria-label="Breadcrumb">
          <a href="index.html" class="hover:text-primary">Home</a>
          <span class="text-sendmystyle-400 px-1.5">/</span>
          <span class="text-heading font-semibold" data-listing-title>Explore Styles</span>
        </nav>

        <div class="mt-4 flex items-end justify-between gap-3">
          <div>
            <h1 class="font-display text-heading text-2xl font-bold sm:text-3xl" data-listing-heading>
              Explore Styles
            </h1>
            <p class="text-body mt-1 text-sm"><span data-count>0</span> products</p>
          </div>
          <div class="flex items-center gap-2">
            <!-- Mobile filter button -->
            <button
              type="button"
              data-open-filters
              class="border-border bg-surface text-heading inline-flex items-center gap-1.5 rounded-lg border px-3 py-2.5 text-sm font-medium lg:hidden"
            >
              <i class="bx bx-slider-alt"></i> Filters
            </button>
            <!-- Sort -->
            <label class="relative">
              <span class="sr-only">Sort by</span>
              <select
                data-sort
                class="border-border bg-surface text-heading focus:border-primary appearance-none rounded-lg border py-2.5 pl-4 pr-9 text-sm font-medium outline-none"
              >
                <option value="popular">Sort: Popular</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="discount">Discount</option>
                <option value="rating">Rating</option>
              </select>
              <i
                class="bx bx-chevron-down text-body pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-lg"
              ></i>
            </label>
          </div>
        </div>

        <!-- Active filter chips -->
        <div data-active-filters class="mt-4 flex flex-wrap items-center gap-2 empty:hidden"></div>

        <div class="mt-4 grid grid-cols-1 gap-6 lg:grid-cols-[240px_1fr]">
          <!-- Filters (desktop) -->
          <aside class="hidden lg:block">
            <div data-filters class="border-border bg-surface rounded-2xl border p-5"></div>
          </aside>

          <!-- Product grid -->
          <div>
            <div data-listing-grid class="grid grid-cols-2 gap-4 sm:grid-cols-3 xl:grid-cols-4"></div>
            <div data-listing-empty class="border-border bg-surface hidden rounded-2xl border p-10 text-center">
              <i class="bx bx-search-alt text-sendmystyle-300 text-4xl"></i>
              <p class="text-heading mt-3 text-sm font-semibold">No products match your filters</p>
              <button
                type="button"
                data-clear-all
                class="text-primary hover:text-primary-hover mt-4 text-sm font-semibold"
              >
                Clear all filters
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Mobile filter drawer -->
    <div data-filter-drawer class="fixed inset-0 z-50 hidden lg:hidden">
      <div
        class="bg-sendmystyle-950/50 absolute inset-0 opacity-0 transition-opacity duration-300"
        data-filter-overlay
      ></div>
      <aside
        class="drawer bg-surface shadow-soft absolute right-0 top-0 flex h-full w-[85%] max-w-sm translate-x-full flex-col"
        data-filter-panel
      >
        <div class="border-border flex items-center justify-between border-b px-5 py-4">
          <h2 class="text-heading text-sm font-bold uppercase tracking-wide">Filters</h2>
          <button type="button" aria-label="Close" class="text-heading text-2xl" data-close-filters>
            <i class="bx bx-x"></i>
          </button>
        </div>
        <div data-filters-mobile class="flex-1 overflow-y-auto p-5"></div>
        <div class="border-border grid grid-cols-2 gap-3 border-t p-4">
          <button
            type="button"
            data-clear-all
            class="border-border text-heading hover:border-primary hover:text-primary rounded-full border py-2.5 text-sm font-semibold"
          >
            Clear All
          </button>
          <button
            type="button"
            data-close-filters
            class="bg-primary hover:bg-primary-hover rounded-full py-2.5 text-sm font-semibold text-white"
          >
            Show Results
          </button>
        </div>
      </aside>
    </div>

    <footer id="site-footer"></footer>
  </body>
</html>
