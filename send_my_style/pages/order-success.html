<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>Order Placed — SendMyStyle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Poppins", "Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] },
                    boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
                    colors: {
                        primary: "#C45C72", "primary-hover": "#A9475C", "primary-active": "#89394B",
                        background: "#FCF3F5", surface: "#FFFFFF", border: "#F1CBD3",
                        heading: "#481F29", body: "#6B2D3B", accent: "#89394B",
                        sendmystyle: { 50: "#FCF3F5", 100: "#F8E5E9", 200: "#F1CBD3", 300: "#E5A9B5", 400: "#D78494", 500: "#C45C72", 600: "#A9475C", 700: "#89394B", 800: "#6B2D3B", 900: "#481F29", 950: "#2D141A" },
                    },
                },
            },
        };
    </script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/script.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body class="flex min-h-screen flex-col bg-background text-body antialiased">
    <div id="site-web-header"></div>
    <div id="site-mobile-header"></div>

    <main class="flex flex-1 items-center justify-center px-5 py-16 sm:px-6">
        <div class="mx-auto max-w-lg text-center">
            <span class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-primary text-4xl text-white">
                <i class="bx bx-check"></i>
            </span>
            <h1 class="font-display mt-6 text-3xl font-bold text-heading">Order Placed!</h1>
            <p class="mt-3 text-base text-body">Thank you for your order. Your customized pieces are being made just for you.</p>

            <div class="mt-6 rounded-2xl border border-border bg-surface p-5 text-left">
                <div class="flex justify-between text-sm">
                    <span class="text-body">Order ID</span>
                    <span class="font-semibold text-heading">#SMS-2026-00184</span>
                </div>
                <div class="mt-2 flex justify-between text-sm">
                    <span class="text-body">Amount Paid</span>
                    <span class="font-semibold text-heading">₹1,998</span>
                </div>
                <div class="mt-2 flex justify-between text-sm">
                    <span class="text-body">Est. Delivery</span>
                    <span class="font-semibold text-primary">5–7 days</span>
                </div>
            </div>

            <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
                <a href="track-order.html" class="group inline-flex w-full items-center justify-center gap-2 rounded-full bg-primary px-6 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-primary-hover active:bg-primary-active sm:w-auto">
                    Track Order <i class="bx bx-right-arrow-alt text-lg"></i>
                </a>
                <a href="index.html" class="inline-flex w-full items-center justify-center gap-2 rounded-full border border-border bg-surface px-6 py-3 text-sm font-semibold text-heading transition hover:border-primary hover:text-primary sm:w-auto">
                    <i class="bx bx-home-alt"></i> Back to Home
                </a>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>
</body>

</html>
