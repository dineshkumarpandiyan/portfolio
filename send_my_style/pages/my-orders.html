<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>My Orders — SendMyStyle</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../assets/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/favicon/favicon-96x96.png" />
    <meta name="apple-mobile-web-app-title" content="SendMyStyle" />
    <link rel="manifest" href="../assets/images/favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Poppins", "Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] },
            boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
            colors: {
              primary: "#C45C72",
              "primary-hover": "#A9475C",
              "primary-active": "#89394B",
              background: "#FCF3F5",
              surface: "#FFFFFF",
              border: "#F1CBD3",
              heading: "#481F29",
              body: "#6B2D3B",
              accent: "#89394B",
              sendmystyle: {
                50: "#FCF3F5",
                100: "#F8E5E9",
                200: "#F1CBD3",
                300: "#E5A9B5",
                400: "#D78494",
                500: "#C45C72",
                600: "#A9475C",
                700: "#89394B",
                800: "#6B2D3B",
                900: "#481F29",
                950: "#2D141A",
              },
            },
          },
        },
      };
    </script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/script.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body class="bg-background text-body flex min-h-screen flex-col antialiased">
    <div id="site-web-header"></div>
    <div id="site-mobile-header"></div>

    <main class="flex-1">
      <div class="mx-auto max-w-6xl px-5 py-6 sm:px-6 md:py-8">
        <h1 class="font-display text-heading text-2xl font-bold sm:text-3xl">My Account</h1>

        <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-[240px_1fr]">
          <aside class="border-border bg-surface h-fit rounded-2xl border p-3">
            <nav class="no-scrollbar flex gap-1 overflow-x-auto text-sm font-medium lg:flex-col">
              <a
                href="profile.html"
                class="text-heading hover:bg-background flex shrink-0 items-center gap-3 whitespace-nowrap rounded-lg px-3 py-2.5 transition"
                ><i class="bx bx-user text-lg"></i> Profile</a
              >
              <a
                href="my-orders.html"
                class="bg-sendmystyle-100 text-primary flex shrink-0 items-center gap-3 whitespace-nowrap rounded-lg px-3 py-2.5 font-semibold"
                ><i class="bx bx-package text-lg"></i> My Orders</a
              >
              <a
                href="wishlist.html"
                class="text-heading hover:bg-background flex shrink-0 items-center gap-3 whitespace-nowrap rounded-lg px-3 py-2.5 transition"
                ><i class="bx bx-heart text-lg"></i> Wishlist</a
              >
              <a
                href="addresses.html"
                class="text-heading hover:bg-background flex shrink-0 items-center gap-3 whitespace-nowrap rounded-lg px-3 py-2.5 transition"
                ><i class="bx bx-map text-lg"></i> Saved Addresses</a
              >
              <a
                href="login.html"
                class="text-heading hover:bg-background flex shrink-0 items-center gap-3 whitespace-nowrap rounded-lg px-3 py-2.5 transition"
                ><i class="bx bx-log-out text-lg"></i> Logout</a
              >
            </nav>
          </aside>

          <section class="space-y-4">
            <!-- Order -->
            <a
              href="order-details.html"
              class="border-border bg-surface hover:shadow-soft block rounded-2xl border p-4 transition"
            >
              <div class="flex items-center justify-between">
                <span class="text-body text-xs font-semibold">#SMS-2026-00184</span>
                <span class="bg-sendmystyle-100 text-primary rounded-full px-2.5 py-1 text-[11px] font-semibold"
                  >In Production</span
                >
              </div>
              <div class="mt-3 flex gap-3">
                <img
                  src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=120&q=60"
                  alt=""
                  class="h-16 w-14 rounded-lg object-cover"
                />
                <img
                  src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=120&q=60"
                  alt=""
                  class="h-16 w-14 rounded-lg object-cover"
                />
                <div class="ml-auto text-right">
                  <p class="text-heading text-sm font-bold">₹1,998</p>
                  <p class="text-body text-xs">2 items</p>
                </div>
              </div>
            </a>
            <!-- Order -->
            <a
              href="order-details.html"
              class="border-border bg-surface hover:shadow-soft block rounded-2xl border p-4 transition"
            >
              <div class="flex items-center justify-between">
                <span class="text-body text-xs font-semibold">#SMS-2026-00092</span>
                <span class="rounded-full bg-green-100 px-2.5 py-1 text-[11px] font-semibold text-green-700"
                  >Delivered</span
                >
              </div>
              <div class="mt-3 flex gap-3">
                <img
                  src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=120&q=60"
                  alt=""
                  class="h-16 w-14 rounded-lg object-cover"
                />
                <div class="ml-auto text-right">
                  <p class="text-heading text-sm font-bold">₹2,199</p>
                  <p class="text-body text-xs">1 item</p>
                </div>
              </div>
            </a>
          </section>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
