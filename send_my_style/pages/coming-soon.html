<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>Coming Soon — SendMyStyle</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Poppins", "Inter", "ui-sans-serif", "system-ui", "sans-serif"],
                        display: ["Space Grotesk", "sans-serif"],
                    },
                    boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
                    colors: {
                        primary: "#C45C72",
                        "primary-hover": "#A9475C",
                        "primary-active": "#89394B",
                        background: "#FCF3F5",
                        surface: "#FFFFFF",
                        border: "#F1CBD3",
                        heading: "#481F29",
                        body: "#6B2D3B",
                        accent: "#89394B",
                        sendmystyle: {
                            50: "#FCF3F5", 100: "#F8E5E9", 200: "#F1CBD3", 300: "#E5A9B5",
                            400: "#D78494", 500: "#C45C72", 600: "#A9475C", 700: "#89394B",
                            800: "#6B2D3B", 900: "#481F29", 950: "#2D141A",
                        },
                    },
                },
            },
        };
    </script>

    <script src="../assets/js/script.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body class="flex min-h-screen flex-col bg-background text-body antialiased">
    <div id="site-web-header"></div>
    <div id="site-mobile-header"></div>

    <main class="flex flex-1 items-center justify-center px-5 py-16 sm:px-6">
        <div class="mx-auto max-w-lg text-center">
            <span
                class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-sendmystyle-100 text-3xl text-primary">
                <i class="bx bx-time-five"></i>
            </span>
            <p class="mt-6 text-[11px] font-bold uppercase tracking-[0.16em] text-primary">Coming soon</p>
            <h1 class="font-display mt-2 text-3xl font-bold text-heading sm:text-4xl" data-page-title>We're building
                this</h1>
            <p class="mt-4 text-base leading-relaxed text-body">
                This part of SendMyStyle is still being crafted. Check back soon — in the meantime, keep exploring
                styles you can make your own.
            </p>
            <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
                <a href="index.html"
                    class="group inline-flex w-full items-center justify-center gap-2 rounded-full bg-primary px-6 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-primary-hover active:bg-primary-active sm:w-auto">
                    <i class="bx bx-home-alt"></i> Back to Home
                </a>
                <a href="product-listing.html"
                    class="inline-flex w-full items-center justify-center gap-2 rounded-full border border-border bg-surface px-6 py-3 text-sm font-semibold text-heading transition hover:border-primary hover:text-primary sm:w-auto">
                    Explore Styles <i class="bx bx-right-arrow-alt text-lg"></i>
                </a>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

    <!-- Set page title from ?page= query, e.g. coming-soon.html?page=Cart -->
    <script>
        (() => {
            const page = new URLSearchParams(location.search).get("page");
            if (page) {
                const el = document.querySelector("[data-page-title]");
                if (el) el.textContent = page + " is coming soon";
                document.title = page + " — SendMyStyle";
            }
        })();
    </script>
</body>

</html>
