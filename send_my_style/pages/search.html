<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>Search — SendMyStyle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Poppins", "Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] },
                    boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
                    colors: {
                        primary: "#C45C72", "primary-hover": "#A9475C", "primary-active": "#89394B",
                        background: "#FCF3F5", surface: "#FFFFFF", border: "#F1CBD3",
                        heading: "#481F29", body: "#6B2D3B", accent: "#89394B",
                        sendmystyle: { 50: "#FCF3F5", 100: "#F8E5E9", 200: "#F1CBD3", 300: "#E5A9B5", 400: "#D78494", 500: "#C45C72", 600: "#A9475C", 700: "#89394B", 800: "#6B2D3B", 900: "#481F29", 950: "#2D141A" },
                    },
                },
            },
        };
    </script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/script.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body class="flex min-h-screen flex-col bg-background text-body antialiased">
    <div id="site-web-header"></div>
    <div id="site-mobile-header"></div>

    <main class="flex-1">
        <div class="mx-auto max-w-6xl px-5 py-6 sm:px-6 md:py-8">
            <!-- Search bar -->
            <div class="relative">
                <i class="bx bx-search pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-xl text-sendmystyle-400"></i>
                <input data-search-input type="text" value="shirt" placeholder="Search for products, brands and more"
                    class="w-full rounded-full border border-border bg-surface py-3.5 pl-12 pr-4 text-sm text-body placeholder:text-sendmystyle-400 outline-none focus:border-primary focus:ring-2 focus:ring-sendmystyle-100" />
            </div>

            <!-- Popular searches -->
            <div class="mt-4 flex flex-wrap items-center gap-2">
                <span class="text-xs font-semibold text-body">Popular:</span>
                <a href="#" class="rounded-full border border-border bg-surface px-3 py-1 text-xs font-medium text-heading hover:border-primary hover:text-primary">Oxford Shirt</a>
                <a href="#" class="rounded-full border border-border bg-surface px-3 py-1 text-xs font-medium text-heading hover:border-primary hover:text-primary">Cotton Tee</a>
                <a href="#" class="rounded-full border border-border bg-surface px-3 py-1 text-xs font-medium text-heading hover:border-primary hover:text-primary">Sneakers</a>
                <a href="#" class="rounded-full border border-border bg-surface px-3 py-1 text-xs font-medium text-heading hover:border-primary hover:text-primary">Summer Dress</a>
            </div>

            <h1 class="mt-6 text-sm font-semibold text-heading"><span data-search-count>0</span> results for "shirt"</h1>
            <div data-search-grid class="mt-4 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4"></div>
        </div>
    </main>

    <footer id="site-footer"></footer>
</body>

</html>
