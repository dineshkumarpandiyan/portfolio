<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0 viewport-fit=cover" />
    <title>Your Bag — SendMyStyle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Poppins", "Inter", "sans-serif"], display: ["Space Grotesk", "sans-serif"] },
                    boxShadow: { soft: "0 18px 50px rgba(15,23,42,.08)" },
                    colors: {
                        primary: "#C45C72", "primary-hover": "#A9475C", "primary-active": "#89394B",
                        background: "#FCF3F5", surface: "#FFFFFF", border: "#F1CBD3",
                        heading: "#481F29", body: "#6B2D3B", accent: "#89394B",
                        sendmystyle: { 50: "#FCF3F5", 100: "#F8E5E9", 200: "#F1CBD3", 300: "#E5A9B5", 400: "#D78494", 500: "#C45C72", 600: "#A9475C", 700: "#89394B", 800: "#6B2D3B", 900: "#481F29", 950: "#2D141A" },
                    },
                },
            },
        };
    </script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/script.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body class="flex min-h-screen flex-col bg-background text-body antialiased">
    <div id="site-web-header"></div>
    <div id="site-mobile-header"></div>

    <main class="flex-1">
        <div class="mx-auto max-w-6xl px-5 py-6 sm:px-6 md:py-8">
            <h1 class="font-display text-2xl font-bold text-heading sm:text-3xl">Your Bag</h1>
            <p class="mt-1 text-sm text-body" data-cart-items-count>0 items</p>

            <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-[1fr_340px]">
                <!-- Items (rendered by initCart) -->
                <div data-cart-list class="space-y-4"></div>

                <!-- Summary -->
                <aside class="h-fit rounded-2xl border border-border bg-surface p-5">
                    <h2 class="text-sm font-bold uppercase tracking-wide text-heading">Order Summary</h2>
                    <dl class="mt-4 space-y-3 text-sm">
                        <div class="flex justify-between"><dt class="text-body">Subtotal</dt><dd class="font-semibold text-heading" data-cart-subtotal>₹0</dd></div>
                        <div class="flex justify-between"><dt class="text-body">Delivery</dt><dd class="font-semibold text-primary">Free</dd></div>
                        <div class="flex justify-between border-t border-border pt-3 text-base"><dt class="font-semibold text-heading">Total</dt><dd class="font-bold text-heading" data-cart-total>₹0</dd></div>
                    </dl>
                    <a href="checkout.html" class="mt-5 flex items-center justify-center gap-2 rounded-full bg-primary px-6 py-3 text-sm font-semibold text-white shadow-soft transition hover:bg-primary-hover active:bg-primary-active">
                        Proceed to Checkout <i class="bx bx-right-arrow-alt text-lg"></i>
                    </a>
                    <a href="product-listing.html" class="mt-3 block text-center text-sm font-semibold text-primary hover:text-primary-hover">Continue Shopping</a>
                </aside>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>
</body>

</html>
