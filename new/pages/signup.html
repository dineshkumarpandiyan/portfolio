<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — SendMyStyle</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Poppins", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "Inter", "sans-serif"],
            },
            boxShadow: { soft: "0 18px 50px rgba(0, 0, 0, 0.06)" },
            colors: {
              background: "#FFFFFF",
              surface: "#FFFFFF",
              heading: "#111111",
              body: "#4B4B4B",
              muted: "#737373",
              border: "#E5E5E5",
              "border-light": "#F0F0F0",
              primary: "#D01050",
              "primary-hover": "#B00040",
              "primary-active": "#900030",
              accent: "#D01050",
              black: "#111111",
              "black-soft": "#1A1A1A",
              white: "#FFFFFF",
              neutral: {
                50: "#FAFAFA",
                100: "#F5F5F5",
                200: "#E5E5E5",
                300: "#D4D4D4",
                400: "#A3A3A3",
                500: "#737373",
                600: "#525252",
                700: "#404040",
                800: "#262626",
                900: "#171717",
                950: "#0A0A0A",
              },
              sendmystyle: {
                50: "#FCEEF2",
                100: "#FAD9E2",
                200: "#F4B3C6",
                300: "#E97DA0",
                400: "#DE4675",
                500: "#D01050",
                600: "#B00040",
                700: "#900030",
                800: "#800028",
                900: "#500018",
                950: "#35000F",
              },
            },
          },
        },
      };
    </script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/script.js"></script>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body class="bg-background text-body font-sans antialiased">
    <header class="sticky top-0 z-50">
      <div id="site-header"></div>
      <div id="mobile-site-header"></div>
    </header>

    <main class="flex min-h-[calc(100vh-140px)] items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <div class="mb-8 text-center">
          <a href="../index.html" class="inline-flex items-center gap-2.5">
            <img src="../assets/images/sms_icon_logo.png" alt="SendMyStyle" class="h-10 w-auto" />
            <span class="font-display text-heading text-2xl font-bold tracking-tight">
              Send<span class="text-primary">My</span>Style
            </span>
          </a>
        </div>

        <div class="border-border bg-surface shadow-soft rounded-2xl border p-8">
          <h1 class="font-display text-heading text-2xl font-bold">Create your account</h1>
          <p class="text-muted mt-1 text-sm">Join SendMyStyle and start designing your style.</p>

          <form id="signup-form" class="mt-6 space-y-4" novalidate>
            <div>
              <label for="su-name" class="text-heading mb-1.5 block text-sm font-medium">Full name</label>
              <input
                id="su-name"
                type="text"
                autocomplete="name"
                placeholder="Your name"
                class="border-border text-heading placeholder:text-muted focus:border-primary focus:ring-primary h-11 w-full rounded-lg border bg-neutral-50 px-4 text-sm focus:bg-white focus:outline-none focus:ring-1"
              />
            </div>

            <div>
              <label for="su-email" class="text-heading mb-1.5 block text-sm font-medium">Email</label>
              <input
                id="su-email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                class="border-border text-heading placeholder:text-muted focus:border-primary focus:ring-primary h-11 w-full rounded-lg border bg-neutral-50 px-4 text-sm focus:bg-white focus:outline-none focus:ring-1"
              />
            </div>

            <div>
              <label for="su-mobile" class="text-heading mb-1.5 block text-sm font-medium">Mobile</label>
              <input
                id="su-mobile"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                placeholder="10-digit mobile number"
                class="border-border text-heading placeholder:text-muted focus:border-primary focus:ring-primary h-11 w-full rounded-lg border bg-neutral-50 px-4 text-sm focus:bg-white focus:outline-none focus:ring-1"
              />
            </div>

            <div>
              <label for="su-password" class="text-heading mb-1.5 block text-sm font-medium">Password</label>
              <div class="relative">
                <input
                  id="su-password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Create a password"
                  class="border-border text-heading placeholder:text-muted focus:border-primary focus:ring-primary h-11 w-full rounded-lg border bg-neutral-50 px-4 pr-11 text-sm focus:bg-white focus:outline-none focus:ring-1"
                />
                <button
                  type="button"
                  id="toggle-pw"
                  class="text-muted hover:text-heading absolute right-3 top-1/2 -translate-y-1/2"
                  aria-label="Show password"
                >
                  <i class="bx bx-hide text-lg"></i>
                </button>
              </div>
            </div>

            <label class="text-body flex items-start gap-2 text-xs">
              <input
                type="checkbox"
                id="su-terms"
                class="border-border text-primary focus:ring-primary mt-0.5 h-4 w-4 rounded"
              />
              <span
                >I agree to the <a href="#" class="text-primary font-medium hover:underline">Terms</a> and
                <a href="#" class="text-primary font-medium hover:underline">Privacy Policy</a>.</span
              >
            </label>

            <p id="signup-error" class="text-primary hidden text-xs font-medium"></p>

            <button
              type="submit"
              class="bg-primary hover:bg-primary-hover h-11 w-full rounded-lg text-sm font-semibold text-white transition-colors"
            >
              Create account
            </button>
          </form>

          <p class="text-body mt-6 text-center text-sm">
            Already have an account?
            <a href="login.html" class="text-primary font-semibold hover:underline">Sign in</a>
          </p>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const pw = document.getElementById("su-password");
        const toggle = document.getElementById("toggle-pw");
        toggle?.addEventListener("click", () => {
          const show = pw.type === "password";
          pw.type = show ? "text" : "password";
          toggle.querySelector("i").className = show ? "bx bx-show text-lg" : "bx bx-hide text-lg";
        });

        const form = document.getElementById("signup-form");
        const err = document.getElementById("signup-error");
        form?.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("su-name").value.trim();
          const email = document.getElementById("su-email").value.trim();
          const terms = document.getElementById("su-terms").checked;

          if (!name || !email || !pw.value.trim()) {
            err.textContent = "Please fill in all required fields.";
            err.classList.remove("hidden");
            return;
          }
          if (!terms) {
            err.textContent = "Please accept the Terms to continue.";
            err.classList.remove("hidden");
            return;
          }
          Auth.login({ name, email });
          window.location.href = "../index.html";
        });
      });
    </script>
  </body>
</html>
