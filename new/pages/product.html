<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — SendMyStyle</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Poppins", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "Inter", "sans-serif"],
            },
            boxShadow: { soft: "0 18px 50px rgba(0, 0, 0, 0.06)" },
            colors: {
              background: "#FFFFFF",
              surface: "#FFFFFF",
              heading: "#111111",
              body: "#4B4B4B",
              muted: "#737373",
              border: "#E5E5E5",
              "border-light": "#F0F0F0",
              primary: "#D01050",
              "primary-hover": "#B00040",
              "primary-active": "#900030",
              accent: "#D01050",
              black: "#111111",
              "black-soft": "#1A1A1A",
              white: "#FFFFFF",
              neutral: {
                50: "#FAFAFA",
                100: "#F5F5F5",
                200: "#E5E5E5",
                300: "#D4D4D4",
                400: "#A3A3A3",
                500: "#737373",
                600: "#525252",
                700: "#404040",
                800: "#262626",
                900: "#171717",
                950: "#0A0A0A",
              },
              sendmystyle: {
                50: "#FCEEF2",
                100: "#FAD9E2",
                200: "#F4B3C6",
                300: "#E97DA0",
                400: "#DE4675",
                500: "#D01050",
                600: "#B00040",
                700: "#900030",
                800: "#800028",
                900: "#500018",
                950: "#35000F",
              },
            },
          },
        },
      };
    </script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/pdp.js"></script>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body class="bg-background text-body font-sans antialiased">
    <header class="sticky top-0 z-50">
      <div id="site-header"></div>
      <div id="mobile-site-header"></div>
    </header>

    <main class="mx-auto w-full max-w-[1300px] px-4 py-6 lg:px-8">
      <nav id="pdp-breadcrumb" class="text-muted mb-5 text-xs"></nav>
      <div id="pdp-root"><!-- injected by JS --></div>

      <!-- Similar products -->
      <section class="mt-16">
        <h2 class="font-display text-heading mb-6 text-2xl font-bold">You may also like</h2>
        <div id="pdp-similar" class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5"></div>
      </section>
    </main>

    <!-- Virtual Try-On modal -->
    <div id="tryon-modal" class="fixed inset-0 z-[100] hidden">
      <div class="tryon-overlay absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
      <div
        class="bg-surface shadow-soft absolute left-1/2 top-1/2 w-[92%] max-w-lg -translate-x-1/2 -translate-y-1/2 overflow-hidden rounded-2xl"
      >
        <div class="border-border flex items-center justify-between border-b px-5 py-4">
          <h3 class="font-display text-heading text-lg font-bold">Virtual Try-On</h3>
          <button class="tryon-close text-muted hover:text-heading"><i class="bx bx-x text-2xl"></i></button>
        </div>
        <div class="p-6 text-center">
          <div
            class="mx-auto flex aspect-[3/4] max-w-xs items-center justify-center rounded-xl border-2 border-dashed border-neutral-300 bg-neutral-50"
          >
            <div>
              <i class="bx bx-camera text-primary text-5xl"></i>
              <p class="text-heading mt-3 text-sm font-semibold">Camera preview</p>
              <p class="text-muted mt-1 px-6 text-xs">Allow camera access to see how this looks on you in real time.</p>
            </div>
          </div>
          <button
            class="bg-primary hover:bg-primary-hover mt-5 h-11 w-full rounded-lg text-sm font-semibold text-white"
          >
            Enable Camera
          </button>
          <p class="text-muted mt-3 text-xs">AR try-on is a preview feature. Fit may vary.</p>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div
      id="toast"
      class="shadow-soft pointer-events-none fixed bottom-6 left-1/2 z-[120] hidden -translate-x-1/2 rounded-lg bg-neutral-950 px-5 py-3 text-sm font-medium text-white"
    ></div>

    <footer id="site-footer"></footer>
  </body>
</html>
