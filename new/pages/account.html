<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account — SendMyStyle</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Poppins", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "Inter", "sans-serif"],
            },
            boxShadow: { soft: "0 18px 50px rgba(0, 0, 0, 0.06)" },
            colors: {
              background: "#FFFFFF",
              surface: "#FFFFFF",
              heading: "#111111",
              body: "#4B4B4B",
              muted: "#737373",
              border: "#E5E5E5",
              "border-light": "#F0F0F0",
              primary: "#D01050",
              "primary-hover": "#B00040",
              "primary-active": "#900030",
              accent: "#D01050",
              black: "#111111",
              "black-soft": "#1A1A1A",
              white: "#FFFFFF",
              neutral: {
                50: "#FAFAFA",
                100: "#F5F5F5",
                200: "#E5E5E5",
                300: "#D4D4D4",
                400: "#A3A3A3",
                500: "#737373",
                600: "#525252",
                700: "#404040",
                800: "#262626",
                900: "#171717",
                950: "#0A0A0A",
              },
              sendmystyle: {
                50: "#FCEEF2",
                100: "#FAD9E2",
                200: "#F4B3C6",
                300: "#E97DA0",
                400: "#DE4675",
                500: "#D01050",
                600: "#B00040",
                700: "#900030",
                800: "#800028",
                900: "#500018",
                950: "#35000F",
              },
            },
          },
        },
      };
    </script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/pages.js"></script>
    <script src="../assets/js/script.js"></script>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body class="text-body bg-neutral-50 font-sans antialiased">
    <header class="sticky top-0 z-50">
      <div id="site-header"></div>
      <div id="mobile-site-header"></div>
    </header>

    <main class="mx-auto w-full max-w-[1200px] px-4 py-8 lg:px-6">
      <h1 class="font-display text-heading text-2xl font-bold">My Account</h1>
      <p class="text-muted mt-1 text-sm">Manage your profile, orders and design preferences.</p>

      <div class="mt-6 grid gap-6 lg:grid-cols-[260px_1fr]">
        <!-- Sidebar -->
        <aside class="border-border bg-surface h-max rounded-xl border p-2">
          <nav id="account-nav" class="space-y-0.5">
            <!-- injected by JS -->
          </nav>
        </aside>

        <!-- Content -->
        <section id="account-content" class="border-border bg-surface rounded-xl border p-6 lg:p-8">
          <!-- injected by JS -->
        </section>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const user = Auth.getUser();
        // Guard: must be logged in
        if (!user) {
          window.location.href = "login.html";
          return;
        }

        const TABS = [
          { id: "profile", icon: "bx-user", label: "My Profile" },
          { id: "orders", icon: "bx-package", label: "My Orders" },
          { id: "designs", icon: "bx-pencil", label: "My Designs" },
          { id: "personalisation", icon: "bx-palette", label: "My Personalisation" },
          { id: "measurements", icon: "bx-ruler", label: "My Measurements" },
          { id: "addresses", icon: "bx-map", label: "Saved Addresses" },
          { id: "wallet", icon: "bx-wallet", label: "SendMyStyle Wallet" },
          { id: "settings", icon: "bx-cog", label: "Settings" },
        ];

        const params = new URLSearchParams(location.search);
        let active = params.get("tab") || "profile";
        if (!TABS.some((t) => t.id === active)) active = "profile";

        const nav = document.getElementById("account-nav");
        const content = document.getElementById("account-content");

        function renderNav() {
          nav.innerHTML =
            TABS.map(
              (t) => `
              <a href="?tab=${t.id}"
                 class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors ${
                   t.id === active
                     ? "bg-sendmystyle-50 text-primary"
                     : "text-body hover:bg-neutral-50 hover:text-primary"
                 }">
                <i class="bx ${t.icon} text-lg"></i>${t.label}
              </a>`,
            ).join("") +
            `
              <button id="acc-logout" class="mt-1 flex w-full items-center gap-3 rounded-lg border-t border-border px-3 py-2.5 text-sm font-semibold text-primary transition-colors hover:bg-sendmystyle-50">
                <i class="bx bx-log-out text-lg"></i>Log out
              </button>`;

          document.getElementById("acc-logout")?.addEventListener("click", () => {
            Auth.logout();
            window.location.href = "../index.html";
          });
        }

        function placeholder(title, text, icon) {
          return `
            <h2 class="font-display text-xl font-bold text-heading">${title}</h2>
            <p class="mt-1 text-sm text-muted">${text}</p>
            <div class="mt-8 flex flex-col items-center justify-center rounded-xl border border-dashed border-neutral-300 py-16 text-center">
              <span class="flex h-14 w-14 items-center justify-center rounded-full bg-sendmystyle-50 text-primary">
                <i class="bx ${icon} text-2xl"></i>
              </span>
              <p class="mt-4 text-sm font-semibold text-heading">Coming soon</p>
              <p class="mt-1 max-w-sm text-sm text-muted">This section is being built. Check back shortly.</p>
            </div>`;
        }

        function renderContent() {
          if (active === "profile") {
            content.innerHTML = `
              <h2 class="font-display text-xl font-bold text-heading">My Profile</h2>
              <p class="mt-1 text-sm text-muted">Your personal details.</p>
              <div class="mt-6 flex items-center gap-4">
                <span class="flex h-16 w-16 items-center justify-center rounded-full bg-sendmystyle-50 text-primary">
                  <i class="bx bx-user text-3xl"></i>
                </span>
                <div>
                  <p class="text-lg font-semibold text-heading">${user.name}</p>
                  <p class="text-sm text-muted">${user.email || "No email on file"}</p>
                </div>
              </div>
              <div class="mt-8 grid gap-4 sm:grid-cols-2">
                <div class="rounded-lg border border-border p-4">
                  <p class="text-xs font-medium uppercase tracking-wide text-muted">Full name</p>
                  <p class="mt-1 text-sm font-semibold text-heading">${user.name}</p>
                </div>
                <div class="rounded-lg border border-border p-4">
                  <p class="text-xs font-medium uppercase tracking-wide text-muted">Email</p>
                  <p class="mt-1 text-sm font-semibold text-heading">${user.email || "—"}</p>
                </div>
              </div>`;
          } else if (active === "addresses") {
            const addrs = Array.isArray(user.addresses) ? user.addresses : [];
            content.innerHTML = `
              <h2 class="font-display text-xl font-bold text-heading">Saved Addresses</h2>
              <p class="mt-1 text-sm text-muted">Manage your delivery locations.</p>
              <div class="mt-6 grid gap-3 sm:grid-cols-2">
                ${addrs
                  .map(
                    (a) => `
                  <div class="rounded-lg border border-border p-4">
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-semibold text-heading">${a.label}</span>
                      <span class="rounded bg-neutral-100 px-1.5 py-0.5 text-[10px] font-medium text-neutral-600">${a.pincode}</span>
                    </div>
                    <p class="mt-1 text-sm text-body">${a.line}, ${a.city}</p>
                  </div>`,
                  )
                  .join("")}
                <button class="flex items-center justify-center gap-2 rounded-lg border border-dashed border-neutral-300 p-4 text-sm font-semibold text-primary transition-colors hover:border-primary hover:bg-sendmystyle-50">
                  <i class="bx bx-plus text-lg"></i> Add a new address
                </button>
              </div>`;
          } else if (active === "designs") {
            content.innerHTML = `<h2 class="mb-5 font-display text-xl font-bold text-heading">My Designs</h2><div id="designs-root"></div>`;
            if (typeof renderDesigns === "function")
              renderDesigns(
                document.getElementById("designs-root"),
                (n) => `₹${Number(n || 0).toLocaleString("en-IN")}`,
                "..",
              );
          } else if (active === "orders") {
            content.innerHTML = `<h2 class="mb-5 font-display text-xl font-bold text-heading">My Orders</h2><div id="orders-root"></div>`;
            if (typeof renderOrders === "function") {
              const money = (n) => `₹${Number(n || 0).toLocaleString("en-IN")}`;
              const empty = (icon, t, tx, href, cta) =>
                `<div class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-neutral-300 py-16 text-center"><i class="bx ${icon} text-5xl text-neutral-300"></i><p class="mt-3 text-sm font-semibold text-heading">${t}</p><p class="mt-1 text-sm text-muted">${tx}</p><a href="${href}" class="mt-4 rounded-lg bg-primary px-5 py-2 text-sm font-semibold text-white">${cta}</a></div>`;
              renderOrders(document.getElementById("orders-root"), money, "..", empty);
            }
          } else {
            const meta = TABS.find((t) => t.id === active);
            content.innerHTML = placeholder(meta.label, "", meta.icon);
          }
        }

        renderNav();
        renderContent();
      });
    </script>
  </body>
</html>
