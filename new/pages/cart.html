<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — SendMyStyle</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "Poppins", "sans-serif"], display: ["Space Grotesk", "Inter", "sans-serif"] },
            boxShadow: { soft: "0 18px 50px rgba(0, 0, 0, 0.06)" },
            colors: {
              background: "#FFFFFF",
              surface: "#FFFFFF",
              heading: "#111111",
              body: "#4B4B4B",
              muted: "#737373",
              border: "#E5E5E5",
              "border-light": "#F0F0F0",
              primary: "#D01050",
              "primary-hover": "#B00040",
              "primary-active": "#900030",
              accent: "#D01050",
              black: "#111111",
              "black-soft": "#1A1A1A",
              white: "#FFFFFF",
              neutral: {
                50: "#FAFAFA",
                100: "#F5F5F5",
                200: "#E5E5E5",
                300: "#D4D4D4",
                400: "#A3A3A3",
                500: "#737373",
                600: "#525252",
                700: "#404040",
                800: "#262626",
                900: "#171717",
                950: "#0A0A0A",
              },
              sendmystyle: {
                50: "#FCEEF2",
                100: "#FAD9E2",
                200: "#F4B3C6",
                300: "#E97DA0",
                400: "#DE4675",
                500: "#D01050",
                600: "#B00040",
                700: "#900030",
                800: "#800028",
                900: "#500018",
                950: "#35000F",
              },
            },
          },
        },
      };
    </script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/pages.js"></script>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body class="text-body bg-neutral-50 font-sans antialiased">
    <header>
      <div id="site-header"></div>
      <div id="mobile-site-header"></div>
    </header>

    <main class="mx-auto w-full max-w-[1200px] px-4 py-8 lg:px-6">
      <h1 class="font-display text-heading text-2xl font-bold">Shopping Cart</h1>
      <p id="cart-count-label" class="text-muted mt-1 text-sm"></p>

      <div id="cart-body" class="mt-6 grid gap-6 lg:grid-cols-[1fr_360px]">
        <!-- items + summary injected by pages.js -->
      </div>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
