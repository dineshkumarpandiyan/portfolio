<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — SendMyStyle</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Poppins", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "Inter", "sans-serif"],
            },
            boxShadow: { soft: "0 18px 50px rgba(0, 0, 0, 0.06)" },
            colors: {
              background: "#FFFFFF",
              surface: "#FFFFFF",
              heading: "#111111",
              body: "#4B4B4B",
              muted: "#737373",
              border: "#E5E5E5",
              "border-light": "#F0F0F0",
              primary: "#D01050",
              "primary-hover": "#B00040",
              "primary-active": "#900030",
              accent: "#D01050",
              black: "#111111",
              "black-soft": "#1A1A1A",
              white: "#FFFFFF",
              neutral: {
                50: "#FAFAFA",
                100: "#F5F5F5",
                200: "#E5E5E5",
                300: "#D4D4D4",
                400: "#A3A3A3",
                500: "#737373",
                600: "#525252",
                700: "#404040",
                800: "#262626",
                900: "#171717",
                950: "#0A0A0A",
              },
              sendmystyle: {
                50: "#FCEEF2",
                100: "#FAD9E2",
                200: "#F4B3C6",
                300: "#E97DA0",
                400: "#DE4675",
                500: "#D01050",
                600: "#B00040",
                700: "#900030",
                800: "#800028",
                900: "#500018",
                950: "#35000F",
              },
            },
          },
        },
      };
    </script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/products.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/plp.js"></script>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body class="bg-background text-body font-sans antialiased">
    <header class="sticky top-0 z-50">
      <div id="site-header"></div>
      <div id="mobile-site-header"></div>
    </header>

    <main class="mx-auto w-full max-w-[1500px] px-4 py-6 lg:px-8">
      <!-- Breadcrumb + title -->
      <nav id="plp-breadcrumb" class="text-muted text-xs"></nav>
      <div class="mt-2 flex flex-wrap items-end justify-between gap-3">
        <h1 id="plp-title" class="font-display text-heading text-2xl font-bold">Shop</h1>
        <p id="plp-count" class="text-muted text-sm"></p>
      </div>

      <!-- Mobile controls -->
      <div class="mt-4 flex gap-3 lg:hidden">
        <button
          id="plp-filter-open"
          class="border-border text-heading flex h-11 flex-1 items-center justify-center gap-2 rounded-lg border text-sm font-semibold"
        >
          <i class="bx bx-slider-alt text-lg"></i> Filters
        </button>
        <div class="relative flex-1">
          <select
            id="plp-sort-mobile"
            class="border-border text-heading focus:border-primary h-11 w-full appearance-none rounded-lg border bg-white px-4 text-sm font-semibold focus:outline-none"
          >
            <!-- options injected -->
          </select>
          <i
            class="bx bx-chevron-down text-muted pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-lg"
          ></i>
        </div>
      </div>

      <div class="mt-6 grid gap-8 lg:grid-cols-[260px_1fr]">
        <!-- Filter sidebar (desktop) -->
        <aside id="plp-filters" class="hidden lg:block">
          <!-- injected by JS -->
        </aside>

        <!-- Results -->
        <section>
          <!-- Sort + active chips (desktop) -->
          <div class="mb-4 hidden items-center justify-between lg:flex">
            <div id="plp-chips" class="flex flex-wrap items-center gap-2"></div>
            <div class="relative shrink-0">
              <select
                id="plp-sort"
                class="border-border text-heading focus:border-primary h-10 appearance-none rounded-lg border bg-white pl-4 pr-10 text-sm font-semibold focus:outline-none"
              >
                <!-- options injected -->
              </select>
              <i
                class="bx bx-chevron-down text-muted pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-lg"
              ></i>
            </div>
          </div>

          <div id="plp-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 xl:grid-cols-4"></div>

          <div id="plp-empty" class="hidden py-24 text-center">
            <i class="bx bx-search-alt text-5xl text-neutral-300"></i>
            <p class="text-heading mt-4 text-sm font-semibold">No products found</p>
            <p class="text-muted mt-1 text-sm">Try adjusting or clearing your filters.</p>
            <button
              id="plp-clear-empty"
              class="bg-primary hover:bg-primary-hover mt-4 rounded-lg px-5 py-2 text-sm font-semibold text-white"
            >
              Clear filters
            </button>
          </div>
        </section>
      </div>
    </main>

    <!-- Mobile filter drawer -->
    <div id="plp-filter-drawer" class="fixed inset-0 z-[95] hidden lg:hidden">
      <div class="plp-drawer-overlay absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
      <aside class="bg-surface absolute right-0 top-0 flex h-full w-[88%] max-w-sm flex-col">
        <div class="border-border flex items-center justify-between border-b px-4 py-4">
          <h3 class="font-display text-heading text-lg font-bold">Filters</h3>
          <button id="plp-filter-close" class="text-muted"><i class="bx bx-x text-2xl"></i></button>
        </div>
        <div id="plp-filters-mobile" class="flex-1 overflow-y-auto p-4"></div>
        <div class="border-border flex gap-3 border-t p-4">
          <button
            id="plp-clear-mobile"
            class="border-border text-heading h-11 flex-1 rounded-lg border text-sm font-semibold"
          >
            Clear all
          </button>
          <button id="plp-apply-mobile" class="bg-primary h-11 flex-1 rounded-lg text-sm font-semibold text-white">
            Show results
          </button>
        </div>
      </aside>
    </div>

    <footer id="site-footer"></footer>
  </body>
</html>
