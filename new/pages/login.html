<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — SendMyStyle</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "Poppins", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ["Space Grotesk", "Inter", "sans-serif"],
            },
            boxShadow: { soft: "0 18px 50px rgba(0, 0, 0, 0.06)" },
            colors: {
              background: "#FFFFFF",
              surface: "#FFFFFF",
              heading: "#111111",
              body: "#4B4B4B",
              muted: "#737373",
              border: "#E5E5E5",
              "border-light": "#F0F0F0",
              primary: "#D01050",
              "primary-hover": "#B00040",
              "primary-active": "#900030",
              accent: "#D01050",
              black: "#111111",
              "black-soft": "#1A1A1A",
              white: "#FFFFFF",
              neutral: {
                50: "#FAFAFA",
                100: "#F5F5F5",
                200: "#E5E5E5",
                300: "#D4D4D4",
                400: "#A3A3A3",
                500: "#737373",
                600: "#525252",
                700: "#404040",
                800: "#262626",
                900: "#171717",
                950: "#0A0A0A",
              },
              sendmystyle: {
                50: "#FCEEF2",
                100: "#FAD9E2",
                200: "#F4B3C6",
                300: "#E97DA0",
                400: "#DE4675",
                500: "#D01050",
                600: "#B00040",
                700: "#900030",
                800: "#800028",
                900: "#500018",
                950: "#35000F",
              },
            },
          },
        },
      };
    </script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/script.js"></script>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  </head>

  <body class="bg-background text-body font-sans antialiased">
    <header class="sticky top-0 z-50">
      <div id="site-header"></div>
      <div id="mobile-site-header"></div>
    </header>

    <main class="flex min-h-[calc(100vh-140px)] items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        <!-- Brand -->
        <div class="mb-8 text-center">
          <a href="../index.html" class="inline-flex items-center gap-2.5">
            <img src="../assets/images/sms_icon_logo.png" alt="SendMyStyle" class="h-10 w-auto" />
            <span class="font-display text-heading text-2xl font-bold tracking-tight">
              Send<span class="text-primary">My</span>Style
            </span>
          </a>
        </div>

        <!-- Card -->
        <div class="border-border bg-surface shadow-soft rounded-2xl border p-8">
          <h1 class="font-display text-heading text-2xl font-bold">Sign in</h1>
          <p class="text-muted mt-1 text-sm">Welcome back. Continue designing your style.</p>

          <form id="login-form" class="mt-6 space-y-4" novalidate>
            <div>
              <label for="login-email" class="text-heading mb-1.5 block text-sm font-medium">Email or Mobile</label>
              <input
                id="login-email"
                type="text"
                autocomplete="username"
                placeholder="you@example.com"
                class="border-border text-heading placeholder:text-muted focus:border-primary focus:ring-primary h-11 w-full rounded-lg border bg-neutral-50 px-4 text-sm focus:bg-white focus:outline-none focus:ring-1"
              />
            </div>

            <div>
              <div class="mb-1.5 flex items-center justify-between">
                <label for="login-password" class="text-heading block text-sm font-medium">Password</label>
                <a href="#" class="text-primary text-xs font-medium hover:underline">Forgot password?</a>
              </div>
              <div class="relative">
                <input
                  id="login-password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  class="border-border text-heading placeholder:text-muted focus:border-primary focus:ring-primary h-11 w-full rounded-lg border bg-neutral-50 px-4 pr-11 text-sm focus:bg-white focus:outline-none focus:ring-1"
                />
                <button
                  type="button"
                  id="toggle-pw"
                  class="text-muted hover:text-heading absolute right-3 top-1/2 -translate-y-1/2"
                  aria-label="Show password"
                >
                  <i class="bx bx-hide text-lg"></i>
                </button>
              </div>
            </div>

            <p id="login-error" class="text-primary hidden text-xs font-medium"></p>

            <button
              type="submit"
              class="bg-primary hover:bg-primary-hover h-11 w-full rounded-lg text-sm font-semibold text-white transition-colors"
            >
              Sign in
            </button>
          </form>

          <div class="my-6 flex items-center gap-3">
            <span class="bg-border h-px flex-1"></span>
            <span class="text-muted text-xs">or continue with</span>
            <span class="bg-border h-px flex-1"></span>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button
              class="border-border text-heading flex h-11 items-center justify-center gap-2 rounded-lg border text-sm font-medium transition-colors hover:border-neutral-300 hover:bg-neutral-50"
            >
              <i class="bx bxl-google text-primary text-lg"></i> Google
            </button>
            <button
              class="border-border text-heading flex h-11 items-center justify-center gap-2 rounded-lg border text-sm font-medium transition-colors hover:border-neutral-300 hover:bg-neutral-50"
            >
              <i class="bx bxl-facebook-circle text-primary text-lg"></i> Facebook
            </button>
          </div>

          <p class="text-body mt-6 text-center text-sm">
            New to SendMyStyle?
            <a href="signup.html" class="text-primary font-semibold hover:underline">Create an account</a>
          </p>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Show/hide password
        const pw = document.getElementById("login-password");
        const toggle = document.getElementById("toggle-pw");
        toggle?.addEventListener("click", () => {
          const show = pw.type === "password";
          pw.type = show ? "text" : "password";
          toggle.querySelector("i").className = show ? "bx bx-show text-lg" : "bx bx-hide text-lg";
        });

        // Demo login — any valid-looking input logs the seed user in
        const form = document.getElementById("login-form");
        const err = document.getElementById("login-error");
        form?.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("login-email").value.trim();
          const pass = pw.value.trim();
          if (!email || !pass) {
            err.textContent = "Please enter your email/mobile and password.";
            err.classList.remove("hidden");
            return;
          }
          const name = typeof CURRENT_USER !== "undefined" && CURRENT_USER.name ? CURRENT_USER.name : "Member";
          Auth.login({ name, email });
          window.location.href = "../index.html";
        });
      });
    </script>
  </body>
</html>
